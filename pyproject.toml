[project]
name = "israel-weather-mcp"
version = "0.1.0"
description = "MCP server that fetches Israeli weather forecasts by driving a real browser with Playwright"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.27.0",
    "python-dotenv>=1.2.2",
    "playwright>=1.44.0",
    "google-genai>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the real weather2day.co.il site (run with: pytest -m live)"]
addopts = "-m 'not live'"
